name: Tourism MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── Job 1: Data Registration ─────────────────────────────────
  data-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements_pipeline.txt

      - name: Register and validate dataset
        run: python tourism_project/model_building/data_register.py

  # ── Job 2: Data Preparation ──────────────────────────────────
  data-preparation:
    runs-on: ubuntu-latest
    needs: data-registration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements_pipeline.txt

      - name: Clean and split data
        run: python tourism_project/model_building/prep.py

      - name: Upload train/test splits as artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: tourism_project/artifacts/

  # ── Job 3: Model Training ─────────────────────────────────────
  model-training:
    runs-on: ubuntu-latest
    needs: data-preparation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements_pipeline.txt

      - name: Download data splits artifact
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/artifacts/

      - name: Train and tune model
        run: python tourism_project/model_building/train.py

      - name: Commit best model to repository
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add tourism_project/deployment/best_model.pkl
          git add tourism_project/artifacts/experiment_log.json
          git diff --cached --quiet || git commit -m "ci: update best model [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
